<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة الحروف الهجائية - تنسيق متوازن</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --border-color: #333; }
        * { box-sizing: border-box; }
        
        @page {
            size: A4;
            margin: 10mm; /* هوامش متوازنة للطباعة */
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; padding: 0; 
            background: #f4f4f4; 
        }

        .page { 
            width: 210mm; 
            min-height: 290mm; 
            background: white; 
            padding: 10mm; 
            margin: 0 auto;
            display: flex; flex-direction: column;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        h1 { margin: 0; font-size: 22px; color: #333; }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 30px; /* مسافة جانبية تعطي شكلاً أرشق */
            row-gap: 6px; 
            flex-grow: 1;
        }

        .letter-row {
            display: grid;
            grid-template-columns: 45px 1fr 1fr 1fr; 
            gap: 6px;
        }

        .char-guide {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            background: #f9f9f9;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px; /* ارتفاع متناسق يجعل المربع أقرب للشكل المربع */
        }

        .empty-box {
            height: 48px;
            border: 1.5px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            position: relative;
        }

        /* سطر مساعدة وهمي */
        .empty-box::after {
            content: "";
            position: absolute;
            top: 60%; width: 70%; right: 15%;
            border-bottom: 1px dotted #ddd;
        }

        .print-btn {
            display: block; width: 150px; margin: 15px auto; 
            padding: 8px; background: #34495e; color: white; 
            text-align: center; border-radius: 5px; cursor: pointer; text-decoration: none;
            font-size: 14px;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; }
            .page { border: none; box-shadow: none; margin: 0; width: 100%; padding: 5mm; }
            .char-guide { -webkit-print-color-adjust: exact; background-color: #f9f9f9 !important; }
        }
    </style>
</head>
<body>

    <a href="#" class="print-btn" onclick="window.print()">طباعة الورقة</a>

    <div class="page">
        <header>
            <h1>كراسة تدريب الحروف الهجائية</h1>
        </header>

        <div class="main-wrapper" id="container">
            <!-- سيتم توليد 28 حرفاً هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'letter-row';
            row.innerHTML = `
                <div class="char-guide">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
