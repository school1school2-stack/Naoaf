<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة الحروف - صفحة واحدة مضمونة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        @page {
            size: A4;
            margin: 0; /* إلغاء هوامش الصفحة الافتراضية */
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; padding: 0; 
            background: #eee;
        }

        .page { 
            width: 210mm; 
            height: 297mm; /* طول الورقة القياسي */
            background: white; 
            padding: 10mm 15mm; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* منع تمدد المحتوى لصفحة ثانية */
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 { margin: 0; font-size: 20px; color: #333; }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 25px;
            row-gap: 3px; /* تقليل المسافة لضمان الحشر في صفحة واحدة */
        }

        .letter-row {
            display: grid;
            grid-template-columns: 42px 1fr 1fr 1fr; 
            gap: 4px;
        }

        .char-guide {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            background: #f4f4f4;
            border: 1.5px solid #000;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 45px; /* ارتفاع مدروس ليناسب 14 صفاً */
        }

        .empty-box {
            height: 45px;
            border: 1.5px solid #000;
            border-radius: 4px;
            background: #fff;
        }

        .print-btn {
            display: block; width: 140px; margin: 10px auto; 
            padding: 8px; background: #2980b9; color: white; 
            text-align: center; border-radius: 5px; cursor: pointer;
            font-size: 13px; text-decoration: none;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; }
            .page { border: none; margin: 0; width: 210mm; height: 297mm; }
        }
    </style>
</head>
<body>

    <a href="#" class="print-btn" onclick="window.print()">اطبع الورقة</a>

    <div class="page">
        <header>
            <h1>كراسة تدريب الحروف الهجائية</h1>
        </header>

        <div class="main-wrapper" id="container">
            <!-- سيتم توليد الحروف هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'letter-row';
            row.innerHTML = `
                <div class="char-guide">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
