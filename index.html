<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة تدريب الحروف الهجائية - 3 فراغات</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary-color: #2c3e50; --border-color: #bdc3c7; }
        body { font-family: 'Tajawal', sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .page { 
            width: 210mm; background: white; padding: 20px; box-sizing: border-box; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); border-radius: 10px;
        }

        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        /* تقسيم الحروف: كل حرف مع فراغاته يأخذ سطر */
        .alphabet-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr; /* حرف ثم 3 مساحات */
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .main-char {
            font-size: 45px;
            color: #e74c3c;
            text-align: center;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 5px;
            border: 1px solid #eee;
        }

        .empty-box {
            height: 80px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            position: relative;
        }

        /* سطر وهمي خفيف لمساعدة الطفل على الكتابة في المنتصف */
        .empty-box::after {
            content: "";
            position: absolute;
            top: 50%; width: 100%;
            border-bottom: 1px dashed #eee;
        }

        .print-btn {
            background: #27ae60; color: white; padding: 10px 30px; border: none;
            border-radius: 5px; cursor: pointer; font-size: 18px; margin-bottom: 20px;
            font-family: 'Tajawal', sans-serif;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; padding: 0; }
            .page { box-shadow: none; border: none; width: 100%; }
            .empty-box { border: 2px solid #333; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">طباعة الورقة</button>

    <div class="page">
        <h1>تدريب على كتابة الحروف الهجائية</h1>
        <div id="alphabet-container">
            <!-- سيتم توليد الصفوف هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('alphabet-container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'alphabet-row';
            row.innerHTML = `
                <div class="main-char">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
