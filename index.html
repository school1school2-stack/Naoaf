<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة الحروف الهجائية - كامل الورقة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --border-color: #333; }
        * { box-sizing: border-box; }
        
        @page {
            size: A4;
            margin: 5mm; /* هوامش صغيرة جداً للطابعة */
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; padding: 0; 
            background: #f0f0f0; 
        }

        .page { 
            width: 210mm; 
            min-height: 297mm; 
            background: white; 
            padding: 5mm; 
            margin: 0 auto;
            display: flex; flex-direction: column;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 10px;
            padding-bottom: 5px;
        }

        h1 { margin: 0; font-size: 24px; color: #000; }

        /* توزيع الحروف على عمودين لتغطية كامل العرض */
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 15px; /* مسافة بين العمودين */
            row-gap: 8px;   /* مسافة بين الأسطر */
            flex-grow: 1;
        }

        .letter-row {
            display: grid;
            grid-template-columns: 55px 1fr 1fr 1fr; /* تكبير مربع الحرف المرجعي */
            gap: 6px;
            align-items: stretch;
        }

        .char-guide {
            font-size: 35px; /* تكبير الحرف */
            font-weight: bold;
            text-align: center;
            color: #000;
            background: #f2f2f2;
            border: 2px solid var(--border-color);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-box {
            height: 58px; /* تكبير ارتفاع مربع الكتابة */
            border: 2px solid var(--border-color);
            border-radius: 5px;
            background: #fff;
            position: relative;
        }

        /* سطر مساعدة وهمي في المنتصف */
        .empty-box::after {
            content: "";
            position: absolute;
            top: 60%; width: 100%;
            border-bottom: 1px dashed #ddd;
        }

        .print-btn {
            display: block; width: 200px; margin: 20px auto; 
            padding: 10px; background: #27ae60; color: white; 
            text-align: center; border-radius: 5px; cursor: pointer; text-decoration: none;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; }
            .page { border: none; box-shadow: none; margin: 0; width: 100%; }
            .char-guide { -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <a href="#" class="print-btn" onclick="window.print()">طباعة الورقة الآن</a>

    <div class="page">
        <header>
            <h1>كراسة تدريب الحروف الهجائية</h1>
        </header>

        <div class="main-wrapper" id="container">
            <!-- سيتم توليد 28 حرفاً هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'letter-row';
            row.innerHTML = `
                <div class="char-guide">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
