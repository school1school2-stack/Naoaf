<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة الحروف الهجائية - صفحة واحدة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --border-color: #444; }
        * { box-sizing: border-box; }
        
        @page {
            size: A4;
            margin: 8mm; /* هوامش متوازنة لمنع الخروج لصفحة ثانية */
        }

        body { 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; padding: 0; 
            background: #eee; 
        }

        .page { 
            width: 210mm; 
            height: 285mm; /* تقليل الارتفاع الكلي لضمان صفحة واحدة */
            background: white; 
            padding: 5mm 10mm; 
            margin: 0 auto;
            display: flex; flex-direction: column;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #ddd;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }

        h1 { margin: 0; font-size: 22px; color: #333; }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 20px;
            row-gap: 4px; /* تقليل المسافة الرأسية */
            flex-grow: 1;
        }

        .letter-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 1fr; 
            gap: 5px;
        }

        .char-guide {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            color: #000;
            background: #f8f8f8;
            border: 1.5px solid var(--border-color);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 52px; /* الارتفاع المثالي لـ 14 سطر في الصفحة */
        }

        .empty-box {
            height: 52px;
            border: 1.5px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
            position: relative;
        }

        /* سطر مساعدة وهمي */
        .empty-box::after {
            content: "";
            position: absolute;
            top: 60%; width: 80%; right: 10%;
            border-bottom: 1px dotted #ccc;
        }

        .print-btn {
            display: block; width: 180px; margin: 15px auto; 
            padding: 8px; background: #2c3e50; color: white; 
            text-align: center; border-radius: 5px; cursor: pointer; text-decoration: none;
            font-size: 14px;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; }
            .page { border: none; box-shadow: none; margin: 0; padding: 5mm; }
            .char-guide { -webkit-print-color-adjust: exact; background-color: #f8f8f8 !important; }
        }
    </style>
</head>
<body>

    <a href="#" class="print-btn" onclick="window.print()">اضغط هنا للطباعة</a>

    <div class="page">
        <header>
            <h1>كراسة تدريب الحروف الهجائية</h1>
        </header>

        <div class="main-wrapper" id="container">
            <!-- سيتم توليد الحروف هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'letter-row';
            row.innerHTML = `
                <div class="char-guide">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
