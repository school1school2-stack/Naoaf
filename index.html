<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورقة تدريب الحروف الهجائية</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --border-color: #d1d1d1;
            --text-color: #333;
        }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: #fdfdfd; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            margin: 0;
            padding: 20px;
        }

        /* حاوية الورقة */
        .page { 
            width: 210mm; 
            min-height: 297mm;
            background: white; 
            padding: 30px; 
            box-sizing: border-box;
            border: 1px solid #eee;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        header h1 { margin: 0; color: var(--primary-color); font-size: 28px; }
        header p { margin: 5px 0; color: #777; font-size: 16px; }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); /* 6 حروف في السطر */
            gap: 20px; /* مسافة أكبر بين المربعات */
        }

        .letter-box {
            aspect-ratio: 1 / 1.2; /* جعل المربع مستطيل قليلاً لزيادة مساحة الكتابة */
            border: 2px solid var(--border-color);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        /* منطقة الحرف المرجعي */
        .char-label {
            background: #f0f7ff;
            height: 35%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: 700;
            color: var(--primary-color);
            border-bottom: 1px dashed var(--border-color);
        }

        /* منطقة الكتابة الفارغة */
        .writing-area {
            flex-grow: 1;
            background: white;
        }

        /* زر الطباعة (يختفي عند الطباعة) */
        .print-btn {
            margin-bottom: 20px;
            padding: 10px 25px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; padding: 0; }
            .page { border: none; width: 100%; padding: 10mm; }
            .letter-box { border: 2px solid #000; } /* حدود أوضح للطباعة */
            .char-label { background: #eee !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">اطبع الورقة الآن</button>

    <div class="page">
        <header>
            <h1>كراسة تعليم الحروف الهجائية</h1>
            <p>اكتب الحرف بشكل جميل داخل المربع</p>
        </header>

        <div class="grid-container" id="alphabet-grid">
            <!-- سيتم توليد الحروف بواسطة JS -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('alphabet-grid');

        letters.forEach(char => {
            const box = document.createElement('div');
            box.className = 'letter-box';
            box.innerHTML = `
                <div class="char-label">${char}</div>
                <div class="writing-area"></div>
            `;
            container.appendChild(box);
        });
    </script>

</body>
</html>
