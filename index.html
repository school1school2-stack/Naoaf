<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورقة الحروف الهجائية - صفحة واحدة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --border-color: #a0a0a0; }
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            margin: 0; padding: 0; 
            background: #f0f0f0; 
            display: flex; flex-direction: column; align-items: center;
        }

        .page { 
            width: 210mm; 
            height: 297mm; 
            background: white; 
            padding: 10mm; 
            display: flex; flex-direction: column;
        }

        h1 { 
            text-align: center; 
            font-size: 22px; 
            margin: 0 0 10px 0; 
            color: #333;
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
        }

        /* تقسيم الصفحة إلى عمودين لتوفير المساحة */
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 20px;
            row-gap: 5px;
            flex-grow: 1;
        }

        .letter-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr 1fr; /* الحرف ثم 3 مربعات */
            gap: 5px;
            align-items: center;
        }

        .char-guide {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            color: #d32f2f;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
            line-height: 45px;
        }

        .empty-box {
            height: 45px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
        }

        .print-btn {
            margin: 10px; padding: 10px 20px; 
            background: #007bff; color: white; 
            border: none; border-radius: 5px; cursor: pointer;
        }

        @media print {
            .print-btn { display: none; }
            body { background: white; }
            .page { border: none; box-shadow: none; margin: 0; width: 100%; height: 100%; }
            .char-guide { -webkit-print-color-adjust: exact; background-color: #f9f9f9 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">طباعة الورقة (ورقة واحدة A4)</button>

    <div class="page">
        <h1>كراسة تدريب الحروف الهجائية</h1>
        <div class="main-wrapper" id="container">
            <!-- سيتم توزيع الحروف هنا -->
        </div>
    </div>

    <script>
        const letters = ["أ", "ب", "ت", "ث", "ج", "ح", "خ", "د", "ذ", "ر", "ز", "س", "ش", "ص", "ض", "ط", "ظ", "ع", "غ", "ف", "ق", "ك", "ل", "م", "ن", "هـ", "و", "ي"];
        const container = document.getElementById('container');

        letters.forEach(char => {
            const row = document.createElement('div');
            row.className = 'letter-row';
            row.innerHTML = `
                <div class="char-guide">${char}</div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
                <div class="empty-box"></div>
            `;
            container.appendChild(row);
        });
    </script>

</body>
</html>
